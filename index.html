<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sohbet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8edf1; --panel:#ffffff; --ink:#14232b; --muted:#6b7c86;
  --mine:#0f4c5c; --mine-ink:#f2fbfd; --theirs:#ffffff; --line:#d3dce2;
  --warn:#d9560b; --radius:18px;
  --otp:#6c5ce7; --ok:#1fb37a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e171c; --panel:#16232a; --ink:#e6eef2; --muted:#8aa0ab;
    --mine:#1d7a8f; --mine-ink:#f2fbfd; --theirs:#1d2e36; --line:#2a3d47;
    --warn:#ff8a4c; --otp:#9a8cff; --ok:#34d399; color-scheme: dark;
  }
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mine);outline-offset:2px}

/* Giriş ekranı */
#gate{
  height:100%;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;
  background:
    radial-gradient(480px 360px at 12% 8%, color-mix(in srgb,var(--otp) 12%,transparent), transparent 70%),
    radial-gradient(520px 400px at 92% 96%, color-mix(in srgb,var(--otp) 10%,transparent), transparent 70%);
}
#pointerLight{
  position:fixed;left:0;top:0;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,color-mix(in srgb,var(--otp) 16%,transparent),transparent 65%);
  transform:translate3d(-999px,-999px,0);will-change:transform;
}
.gate-box{width:min(380px,100%);display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}
.gate-box[hidden]{display:none}
.gate-box h1{font-size:2.2rem;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.gate-box p{color:var(--muted);line-height:1.5}
.gate-box button{
  background:var(--mine);color:var(--mine-ink);border:0;border-radius:14px;
  padding:14px;font-weight:600;cursor:pointer;
}
.gate-box button.pick{
  font-size:1.25rem;letter-spacing:.12em;font-variant-numeric:tabular-nums;
  padding:18px;
}
.gate-box button.back{
  background:none;border:1px solid var(--line);color:var(--muted);
}

/* ===== OTP kartı ===== */
#stepRoom{width:min(400px,100%)}
.otp-card{
  position:relative;background:var(--panel);border:1.5px solid transparent;border-radius:28px;
  padding:38px 22px 26px;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.05),0 34px 70px -34px rgba(50,45,130,.35);
  transition:border-color .5s,box-shadow .5s;
}
.otp-card h1{font-size:1.55rem;letter-spacing:-.01em}
.otp-card p{font-size:.88rem;margin-top:8px}
.otp-stage{position:relative;height:170px;margin-top:6px}
.otp-boxes{
  position:absolute;inset:0;display:flex;gap:9px;justify-content:center;align-items:center;
  transition:opacity .35s;
}
.otp-box{
  width:clamp(36px,11.5vw,46px);height:clamp(48px,14vw,58px);flex:none;text-align:center;
  font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--bg);border:1.5px solid var(--line);border-radius:14px;outline:none;
  caret-color:var(--otp);padding:0;
  box-shadow:0 8px 16px -10px rgba(60,50,140,.3);
  transition:transform .25s,border-color .2s,box-shadow .2s,background .2s;
}
.otp-box:focus{
  transform:translateY(-4px);border-color:var(--otp);background:var(--panel);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--otp) 18%,transparent),0 14px 22px -10px color-mix(in srgb,var(--otp) 55%,transparent);
}
.otp-box.filled{background:var(--panel);border-color:color-mix(in srgb,var(--otp) 50%,var(--line))}
.otp-box.err{border-color:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 16%,transparent)}
.otp-boxes.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* kutular dağılır */
.otp-card[data-state="scatter"] .otp-box{
  transition:transform .65s cubic-bezier(.2,.8,.2,1),border-color .3s;
  transform:translate(var(--tx),var(--ty)) rotate(var(--r)) scale(.92);
  border-color:var(--otp);background:var(--panel);
}
.otp-card[data-state="verifying"] .otp-boxes,
.otp-card[data-state="success"] .otp-boxes{opacity:0;pointer-events:none}
.otp-card[data-state="verifying"] .otp-box,
.otp-card[data-state="success"] .otp-box{transform:translate(var(--tx),var(--ty)) rotate(var(--r)) scale(.5)}

/* yüzde halkası */
.otp-ring{
  position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;
  opacity:0;transform:scale(.6);pointer-events:none;
  transition:opacity .4s,transform .5s cubic-bezier(.2,.9,.3,1.3);
}
.otp-card[data-state="verifying"] .otp-ring{opacity:1;transform:none}
.otp-ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.otp-ring circle{fill:none;stroke-width:5}
.otp-ring .track{stroke:color-mix(in srgb,var(--otp) 16%,transparent)}
.otp-ring .prog{
  stroke:var(--otp);stroke-linecap:round;stroke-dasharray:226.2;stroke-dashoffset:226.2;
  filter:drop-shadow(0 0 6px color-mix(in srgb,var(--otp) 55%,transparent));
}
.otp-ring b{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:1.35rem;font-variant-numeric:tabular-nums;color:var(--otp);
}

/* başarı */
.otp-ok{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.otp-card[data-state="success"] .otp-ok{opacity:1}
.otp-check{
  width:76px;height:76px;border-radius:50%;display:grid;place-items:center;transform:scale(0);
  background:linear-gradient(145deg,color-mix(in srgb,var(--ok) 70%,#fff),var(--ok));
  box-shadow:0 0 0 8px color-mix(in srgb,var(--ok) 16%,transparent),0 14px 30px -8px color-mix(in srgb,var(--ok) 70%,transparent);
}
.otp-check svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
.otp-badge{
  font-size:.7rem;font-weight:700;letter-spacing:.14em;color:#fff;background:var(--ok);
  padding:5px 14px;border-radius:999px;transform:translateY(8px);opacity:0;
}
.otp-card[data-state="success"]{
  border-color:color-mix(in srgb,var(--ok) 60%,transparent);
  box-shadow:0 1px 3px rgba(0,0,0,.05),0 34px 80px -30px color-mix(in srgb,var(--ok) 65%,transparent);
}
.otp-card[data-state="success"] .otp-check{animation:pop .55s .1s cubic-bezier(.2,.9,.3,1.4) forwards}
.otp-card[data-state="success"] .otp-check svg{animation:draw .4s .5s ease-out forwards}
.otp-card[data-state="success"] .otp-badge{animation:rise .4s .75s ease-out forwards}
@keyframes pop{to{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{to{transform:none;opacity:1}}
.pt{position:absolute;left:50%;top:42%;border-radius:2px;pointer-events:none}

#gateErr{color:var(--warn);min-height:1.2em;font-size:.88rem;text-align:center;margin-top:6px}

/* Sohbet */
#app{display:none;height:100%;flex-direction:column;max-width:760px;margin:0 auto;background:var(--panel)}
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line);
}
header b{font-size:1.05rem}
header small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.hbtns button{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;color:var(--muted)}
#clearAll{color:var(--warn);border-color:var(--warn)}
#list{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:260px;line-height:1.5}
.msg{max-width:78%;display:flex;flex-direction:column;gap:3px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.them{align-self:flex-start;align-items:flex-start}
.bubble{
  padding:10px 14px;border-radius:var(--radius);line-height:1.4;
  white-space:pre-wrap;word-break:break-word;
}
.me .bubble{background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:5px}
.them .bubble{background:var(--theirs);border:1px solid var(--line);border-bottom-left-radius:5px}
.meta{font-size:.72rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.meta .timer{color:var(--warn);font-variant-numeric:tabular-nums}
.tick{font-weight:700;letter-spacing:-.15em;margin-right:.15em}
.tick.seen{color:#34b7f1}
.act{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-size:.72rem;text-decoration:underline}
.act.del{color:var(--warn)}
.editbox{display:flex;flex-direction:column;gap:6px;align-items:flex-end;width:min(420px,70vw)}
.editbox input{
  width:100%;background:var(--panel);border:1.5px solid var(--mine);
  border-radius:14px;padding:10px 14px;
}
.editbox div{display:flex;gap:8px}
.editbox button{
  border:1px solid var(--line);background:var(--panel);border-radius:10px;
  padding:5px 12px;cursor:pointer;font-size:.85rem;
}
.editbox button.ok{background:var(--mine);color:var(--mine-ink);border-color:var(--mine)}
form{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
form input{
  flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:12px 18px;
}
form button{
  background:var(--mine);color:var(--mine-ink);border:0;border-radius:999px;
  padding:0 22px;font-weight:600;cursor:pointer;
}
form button:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion: no-preference){
  .msg{animation:msgpop .18s ease-out}
  @keyframes msgpop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion: reduce){
  .otp-card *{transition-duration:.01s!important;animation-duration:.01s!important}
}
</style>
</head>
<body>

<section id="gate">
  <div id="pointerLight"></div>

  <!-- 1. adım: oda kodu (OTP) -->
  <div class="gate-box" id="stepRoom">
    <div class="otp-card" id="otpCard" data-state="input">
      <h1 id="otpTitle">Oda kodu</h1>
      <p id="otpSub">Sohbete girmek için 6 haneli oda kodunu yaz.</p>

      <div class="otp-stage">
        <div class="otp-boxes" id="otpBoxes">
          <input class="otp-box" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Oda kodu 1. hane">
          <input class="otp-box" type="text" inputmode="numeric" autocomplete="off" aria-label="Oda kodu 2. hane">
          <input class="otp-box" type="text" inputmode="numeric" autocomplete="off" aria-label="Oda kodu 3. hane">
          <input class="otp-box" type="text" inputmode="numeric" autocomplete="off" aria-label="Oda kodu 4. hane">
          <input class="otp-box" type="text" inputmode="numeric" autocomplete="off" aria-label="Oda kodu 5. hane">
          <input class="otp-box" type="text" inputmode="numeric" autocomplete="off" aria-label="Oda kodu 6. hane">
        </div>

        <div class="otp-ring" aria-hidden="true">
          <svg viewBox="0 0 92 92">
            <circle class="track" cx="46" cy="46" r="36"/>
            <circle class="prog" id="ringProg" cx="46" cy="46" r="36"/>
          </svg>
          <b id="ringNum">0</b>
        </div>

        <div class="otp-ok" id="otpOk" aria-hidden="true">
          <div class="otp-check"><svg viewBox="0 0 36 36"><path d="M8 19l7 7 13-14"/></svg></div>
          <div class="otp-badge">DOĞRULANDI</div>
        </div>
      </div>

      <div id="gateErr" role="alert"></div>
    </div>
  </div>

  <!-- 2. adım: kimlik seçimi -->
  <div class="gate-box" id="stepPick" hidden>
    <h1>Kimsin?</h1>
    <p>Giriş yapmak istediğin kodu seç.</p>
    <button class="pick" data-key="25.01.14">25.01.14</button>
    <button class="pick" data-key="22.02.14">22.02.14</button>
    <button class="back" id="backBtn" type="button">Geri</button>
  </div>
</section>

<main id="app">
  <header>
    <div><b id="who"></b><small>Görülen mesajlar 1 dakika sonra ya da çıkınca silinir</small></div>
    <div class="hbtns">
      <button id="clearAll">Geçmişi sil</button>
      <button id="logout">Çıkış</button>
    </div>
  </header>
  <div id="list" aria-live="polite"></div>
  <form id="sendForm">
    <input id="msgInput" autocomplete="off" placeholder="Mesaj yaz" aria-label="Mesaj">
    <button id="sendBtn" type="submit">Gönder</button>
  </form>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============ AYARLAR ============ */

const firebaseConfig = {
  apiKey: "AIzaSyDPNrjApyG_sjWL6ZJrLnQkFLRyolvxSP0",
  authDomain: "zenom-14d18.firebaseapp.com",
  projectId: "zenom-14d18",
  storageBucket: "zenom-14d18.firebasestorage.app",
  messagingSenderId: "583892968779",
  appId: "1:583892968779:web:38f583b71b777a39b5b4ce"
};

// Tek oda kodu (6 hane)
const ROOM_CODE = "212225";

// Oda koduna girince çıkan iki seçenek (id'ler eskisiyle aynı: A ve B)
const PROFILES = {
  "25.01.14": { id: "A", name: "Ben" },
  "22.02.14": { id: "B", name: "Karşı taraf" }
};

// Görüldükten kaç ms sonra silinsin (1 dakika)
const DELETE_AFTER_MS = 60 * 1000;

/* ================================= */

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const col = db.collection("messages");

const $ = id => document.getElementById(id);
let me = null;
let unsub = null;
let docs = [];
let tick = null;
let editing = null;      // {id, value}
let forceScroll = true;
const seenReq = new Set();

/* ---- OTP oda kodu girişi ---- */
const OTP_LEN = 6;
const CODE_DIGITS = ROOM_CODE.replace(/\D/g, "");
const boxes = [...document.querySelectorAll(".otp-box")];
const card = $("otpCard");
const ringProg = $("ringProg");
const ringNum = $("ringNum");
let otpBusy = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function setState(s){ card.dataset.state = s; }
function setText(t, s){ $("otpTitle").textContent = t; $("otpSub").textContent = s; }
function getCode(){ return boxes.map(b => b.value).join(""); }
function setRing(p){
  ringProg.style.strokeDashoffset = 226.2 * (1 - p);
  ringNum.textContent = Math.round(p * 100);
}

function resetOtp(){
  otpBusy = false;
  boxes.forEach(b => { b.value = ""; b.readOnly = false; b.classList.remove("filled", "err"); });
  $("otpBoxes").classList.remove("shake");
  setState("input");
  setText("Oda kodu", "Sohbete girmek için 6 haneli oda kodunu yaz.");
  $("gateErr").textContent = "";
  setRing(0);
}

function fillFrom(i, digits){
  for(let k = 0; k < digits.length && i + k < OTP_LEN; k++){
    boxes[i + k].value = digits[k];
    boxes[i + k].classList.add("filled");
  }
  boxes[Math.min(i + digits.length, OTP_LEN - 1)].focus();
  if(getCode().length === OTP_LEN) submitOtp();
}

boxes.forEach((b, i) => {
  b.addEventListener("focus", () => b.select());
  b.addEventListener("input", () => {
    if(otpBusy) return;
    const d = b.value.replace(/\D/g, "");
    if(d.length > 1){ fillFrom(i, d); return; }
    b.value = d;
    b.classList.toggle("filled", !!d);
    $("gateErr").textContent = "";
    if(d && i < OTP_LEN - 1) boxes[i + 1].focus();
    if(getCode().length === OTP_LEN) submitOtp();
  });
  b.addEventListener("keydown", e => {
    if(otpBusy) { e.preventDefault(); return; }
    if(e.key === "Backspace" && !b.value && i > 0){
      e.preventDefault();
      boxes[i - 1].value = "";
      boxes[i - 1].classList.remove("filled");
      boxes[i - 1].focus();
    }
    if(e.key === "ArrowLeft" && i > 0){ e.preventDefault(); boxes[i - 1].focus(); }
    if(e.key === "ArrowRight" && i < OTP_LEN - 1){ e.preventDefault(); boxes[i + 1].focus(); }
  });
  b.addEventListener("paste", e => {
    e.preventDefault();
    if(otpBusy) return;
    const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "");
    if(d) fillFrom(d.length >= OTP_LEN ? 0 : i, d.slice(0, OTP_LEN));
  });
});

function runRing(ms){
  return new Promise(res => {
    const t0 = performance.now();
    (function f(t){
      const p = Math.min(1, (t - t0) / ms);
      setRing(1 - Math.pow(1 - p, 1.6));
      p < 1 ? requestAnimationFrame(f) : res();
    })(t0);
  });
}

function burst(){
  const stage = $("otpOk");
  const colors = ["#1fb37a", "#6c5ce7", "#f6b93b", "#ee5a8a", "#38bdf8", "#34d399"];
  for(let i = 0; i < 26; i++){
    const p = document.createElement("span");
    const s = 5 + Math.random() * 6;
    p.className = "pt";
    p.style.cssText = "width:" + s + "px;height:" + s + "px;background:" + colors[i % colors.length];
    stage.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 80;
    p.animate([
      { transform: "translate(-50%,0) scale(.4)", opacity: 1 },
      { transform: "translate(calc(-50% + " + Math.cos(a) * d + "px)," + Math.sin(a) * d + "px) rotate(" + (Math.random() * 360) + "deg) scale(1)", opacity: 0 }
    ], { duration: 900 + Math.random() * 600, easing: "cubic-bezier(.2,.8,.3,1)", delay: 150 }).onfinish = () => p.remove();
  }
}

async function submitOtp(){
  if(otpBusy) return;
  otpBusy = true;
  const code = getCode();
  document.activeElement && document.activeElement.blur();
  boxes.forEach(b => {
    b.readOnly = true;
    const r = n => (Math.random() * 2 - 1) * n;
    b.style.setProperty("--tx", (r(70) + (Math.random() < .5 ? -35 : 35)) + "px");
    b.style.setProperty("--ty", (r(40) + (Math.random() < .5 ? -30 : 30)) + "px");
    b.style.setProperty("--r", r(40) + "deg");
  });
  setState("scatter");
  await sleep(650);
  setState("verifying");
  setText("Doğrulanıyor…", "Kod güvenle kontrol ediliyor.");
  await runRing(1700);
  await sleep(150);

  if(code === CODE_DIGITS){
    setState("success");
    setText("Erişim onaylandı", "Hoş geldin. Kimlik seçimine geçiliyor…");
    burst();
    await sleep(1700);
    $("stepRoom").hidden = true;
    $("stepPick").hidden = false;
  } else {
    setState("input");
    setText("Oda kodu", "Sohbete girmek için 6 haneli oda kodunu yaz.");
    $("gateErr").textContent = "Oda kodu yanlış, tekrar dene.";
    boxes.forEach(b => b.classList.add("err"));
    $("otpBoxes").classList.add("shake");
    await sleep(700);
    resetOtp();
    $("gateErr").textContent = "Oda kodu yanlış, tekrar dene.";
    boxes[0].focus();
  }
}

// İmleci takip eden yumuşak ışık
const pl = $("pointerLight");
window.addEventListener("pointermove", e => {
  pl.style.transform = "translate3d(" + (e.clientX - 210) + "px," + (e.clientY - 210) + "px,0)";
});

/* ---- Giriş ---- */
function enterAs(key){
  const u = PROFILES[key];
  if(!u) return false;
  me = u;
  sessionStorage.setItem("chatProfile", key);
  $("gate").style.display = "none";
  $("app").style.display = "flex";
  $("who").textContent = u.name + " olarak giriş yaptın";
  forceScroll = true;
  start();
  return true;
}

document.querySelectorAll(".pick").forEach(b => {
  b.onclick = () => enterAs(b.dataset.key);
});
$("backBtn").onclick = () => {
  $("stepPick").hidden = true;
  $("stepRoom").hidden = false;
  resetOtp();
  boxes[0].focus();
};
$("logout").onclick = async () => {
  await purgeSeen();
  sessionStorage.removeItem("chatProfile");
  if(unsub) unsub();
  clearInterval(tick);
  location.reload();
};
const saved = sessionStorage.getItem("chatProfile");
if(saved) enterAs(saved); else boxes[0].focus();

/* ---- Dinleme ---- */
function start(){
  let firstSnap = true;
  unsub = col.orderBy("createdAt").onSnapshot(snap => {
    docs = snap.docs.map(d => ({ id: d.id, pending: d.metadata.hasPendingWrites, ...d.data() }));
    // Düzenlenen mesaj silindiyse düzenlemeyi kapat
    if(editing && !docs.some(m => m.id === editing.id)) editing = null;
    // Önceki oturumda görülüp silinememiş mesajları temizle (yedek)
    if(firstSnap){ firstSnap = false; purgeSeen(); }
    markDelivered();
    markSeen();
    cleanup();
    render();
  }, err => {
    $("list").innerHTML = '<div class="empty">Bağlantı hatası: ' + err.message + '</div>';
  });
  tick = setInterval(() => { cleanup(); updateTimers(); markSeen(); }, 1000);
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "hidden") purgeSeen();
    else markSeen();
  });
  window.addEventListener("focus", markSeen);
  window.addEventListener("pagehide", purgeSeen);
}

/* ---- İletildi işaretleme (karşıdan gelen mesaj, sayfa açıksa) ---- */
const deliveredReq = new Set();
function markDelivered(){
  docs.forEach(m => {
    if(m.from !== me.id && !m.deliveredAt && !m.pending && !deliveredReq.has(m.id)){
      deliveredReq.add(m.id);
      col.doc(m.id).update({
        deliveredAt: firebase.firestore.Timestamp.fromMillis(Date.now())
      }).catch(()=>{});
    }
  });
}

/* ---- Görüldü işaretleme (sayfa açık ve görünürken) ---- */
function markSeen(){
  if(!me || document.visibilityState !== "visible") return;
  docs.forEach(m => {
    if(m.from !== me.id && !m.seenAt && !m.pending && !seenReq.has(m.id)){
      seenReq.add(m.id);
      const now = Date.now();
      const upd = {
        seenAt: firebase.firestore.Timestamp.fromMillis(now),
        deleteAt: firebase.firestore.Timestamp.fromMillis(now + DELETE_AFTER_MS)
      };
      if(!m.deliveredAt) upd.deliveredAt = firebase.firestore.Timestamp.fromMillis(now);
      col.doc(m.id).update(upd).catch(()=>{ seenReq.delete(m.id); });
    }
  });
}

/* ---- Görülmüş mesajları hemen sil (çıkarken / sekme gizlenince) ---- */
function purgeSeen(){
  if(!me) return Promise.resolve();
  const seen = docs.filter(m =>
    m.from !== me.id && !m._deleting && (m.deleteAt || seenReq.has(m.id))
  );
  if(!seen.length) return Promise.resolve();
  seen.forEach(m => m._deleting = true);
  const batch = db.batch();
  seen.forEach(m => batch.delete(col.doc(m.id)));
  return batch.commit().catch(()=>{});
}

/* ---- Süresi dolanları sil ---- */
function cleanup(){
  const now = Date.now();
  let changed = false;
  docs.forEach(m => {
    if(m.deleteAt && m.deleteAt.toMillis && m.deleteAt.toMillis() <= now && !m._deleting){
      m._deleting = true;
      changed = true;
      col.doc(m.id).delete().catch(()=>{});
    }
  });
  if(changed) render();
}

/* ---- Mesaj sil / düzenle / geçmişi sil ---- */
function deleteMessage(id){
  if(!confirm("Bu mesaj iki taraf için de silinsin mi?")) return;
  col.doc(id).delete().catch(err => alert("Silinemedi: " + err.message));
}

function saveEdit(){
  if(!editing) return;
  const text = editing.value.trim();
  const id = editing.id;
  const old = docs.find(m => m.id === id);
  editing = null;
  if(!text){ render(); return; }
  if(old && old.text === text){ render(); return; }
  col.doc(id).update({ text, edited: true })
    .catch(err => alert("Düzenlenemedi: " + err.message));
  render();
}

async function clearHistory(){
  if(!confirm("Tüm sohbet geçmişi hem senin hem karşı tarafın ekranından silinecek. Emin misin?")) return;
  try{
    const snap = await col.get();
    const refs = snap.docs.map(d => d.ref);
    for(let i = 0; i < refs.length; i += 400){
      const batch = db.batch();
      refs.slice(i, i + 400).forEach(r => batch.delete(r));
      await batch.commit();
    }
  }catch(err){
    alert("Geçmiş silinemedi: " + err.message);
  }
}
$("clearAll").onclick = clearHistory;

/* ---- Çizim ---- */
function fmtTime(ts){
  if(!ts || !ts.toDate) return "";
  return ts.toDate().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
}
function remaining(m){
  if(!m.deleteAt || !m.deleteAt.toMillis) return null;
  return Math.max(0, Math.ceil((m.deleteAt.toMillis() - Date.now())/1000));
}
function fmtRemain(s){
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}

function render(){
  const list = $("list");
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  const visible = docs.filter(m => !m._deleting);
  list.innerHTML = "";
  if(!visible.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Henüz mesaj yok. İlk mesajı sen yaz.";
    list.appendChild(e);
    return;
  }
  let editInput = null;
  visible.forEach(m => {
    const mine = m.from === me.id;
    const wrap = document.createElement("div");
    wrap.className = "msg " + (mine ? "me" : "them");
    wrap.dataset.id = m.id;

    if(editing && editing.id === m.id){
      const box = document.createElement("div");
      box.className = "editbox";
      const inp = document.createElement("input");
      inp.value = editing.value;
      inp.setAttribute("aria-label", "Mesajı düzenle");
      inp.addEventListener("input", () => { editing.value = inp.value; });
      inp.addEventListener("keydown", e => {
        if(e.key === "Enter"){ e.preventDefault(); saveEdit(); }
        if(e.key === "Escape"){ editing = null; render(); }
      });
      const row = document.createElement("div");
      const cancel = document.createElement("button");
      cancel.type = "button"; cancel.textContent = "İptal";
      cancel.onclick = () => { editing = null; render(); };
      const ok = document.createElement("button");
      ok.type = "button"; ok.className = "ok"; ok.textContent = "Kaydet";
      ok.onclick = saveEdit;
      row.append(cancel, ok);
      box.append(inp, row);
      wrap.appendChild(box);
      editInput = inp;
    } else {
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = m.text;
      wrap.appendChild(b);

      const meta = document.createElement("div");
      meta.className = "meta";
      const t = document.createElement("span");
      t.textContent = fmtTime(m.createdAt);
      meta.appendChild(t);

      if(m.edited){
        const ed = document.createElement("span");
        ed.textContent = "düzenlendi";
        meta.appendChild(ed);
      }
      if(mine){
        const st = document.createElement("span");
        st.className = "status";
        meta.appendChild(st);
      }
      const tm = document.createElement("span");
      tm.className = "timer";
      meta.appendChild(tm);

      if(mine && !m.pending){
        const eb = document.createElement("button");
        eb.type = "button"; eb.className = "act"; eb.textContent = "Düzenle";
        eb.onclick = () => { editing = { id: m.id, value: m.text }; render(); };
        const db_ = document.createElement("button");
        db_.type = "button"; db_.className = "act del"; db_.textContent = "Sil";
        db_.onclick = () => deleteMessage(m.id);
        meta.append(eb, db_);
      }
      wrap.appendChild(meta);
    }
    list.appendChild(wrap);
  });
  updateTimers();
  if(forceScroll || nearBottom){ list.scrollTop = list.scrollHeight; forceScroll = false; }
  if(editInput){
    editInput.focus();
    const n = editInput.value.length;
    editInput.setSelectionRange(n, n);
  }
}

function updateTimers(){
  document.querySelectorAll(".msg").forEach(el => {
    const m = docs.find(x => x.id === el.dataset.id);
    if(!m) return;
    const rem = remaining(m);
    const tm = el.querySelector(".timer");
    const st = el.querySelector(".status");
    if(st){
      if(m.pending){ st.className = "status tick"; st.textContent = "🕓"; st.title = "Gönderiliyor"; }
      else if(m.seenAt || m.deleteAt){ st.className = "status tick seen"; st.textContent = "✓✓"; st.title = "Görüldü"; }
      else if(m.deliveredAt){ st.className = "status tick"; st.textContent = "✓✓"; st.title = "İletildi"; }
      else { st.className = "status tick"; st.textContent = "✓"; st.title = "Gönderildi"; }
    }
    if(tm) tm.textContent = rem !== null ? "• " + fmtRemain(rem) + " sonra silinir" : "";
  });
}

/* ---- Gönderme ---- */
$("sendForm").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("msgInput");
  const text = input.value.trim();
  if(!text) return;
  input.value = "";
  forceScroll = true;
  col.add({
    text,
    from: me.id,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    deliveredAt: null,
    seenAt: null,
    deleteAt: null
  }).catch(err => alert("Gönderilemedi: " + err.message));
  input.focus();
});
</script>
